[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; ARDUINO_USB_CDC_ON_BOOT: ESP32-C3-MINI-1 has no UART bridge chip, only
; native USB. This flag routes Serial over USB CDC from the first boot
; message instead of staying silent until the sketch opens it manually.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
